services:
  mysql:
    image: mysql:8.0
    container_name: internship_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: internship_db
      MYSQL_USER: internship_user
      MYSQL_PASSWORD: internship_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - internship_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internship_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/internship_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: internship_user
      SPRING_DATASOURCE_PASSWORD: internship_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internship_network

volumes:
  mysql_data:

networks:
  internship_network:
    driver: bridge
