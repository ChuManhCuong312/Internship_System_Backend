spring:
  datasource:
    url: jdbc:mysql://mysql:3306/internship_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: internship_user
    password: internship_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    initialization-mode: always
    continue-on-error: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      continue-on-error: true

  flyway:
    enabled: false

server:
  port: 8080
